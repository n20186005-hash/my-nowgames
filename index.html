                sitemap: "Mapa strony",
                terms: "Warunki",
                privacy: "Prywatność",
                disclaimer: "Oświadczenie",
                friendlyLinks: "Przyjazne linki"
            },
            modals: {
                about: {
                    title: "O nas",
                    content: "Gra Pips została stworzona przez mały zespół entuzjastów łamigłówek. Naszą misją jest utrzymanie sprawności Twojego umysłu dzięki proceduralnie generowanym zagadkom. Wierzymy w dostępne gry: bez reklam i bez opłat."
                },
                sitemap: {
                    title: "Mapa strony",
                    content: "Nawigacja:",
                    links: ["Gra", "Zasady", "Ustawienia", "Tryb Nielimitowany", "Statystyki", "Prawne"]
                },
                terms: {
                    title: "Warunki użytkowania",
                    content: "Witamy w Pips Game. Uzyskując dostęp do naszej strony, zgadzasz się używać jej do osobistej, niekomercyjnej rozrywki. Gra jest dostarczana „taka jaka jest”."
                },
                privacy: {
                    title: "Polityka prywatności",
                    content: "Szanujemy Twoją prywatność. Pips Game nie zbiera żadnych danych osobowych. Cały postęp gry jest zapisywany lokalnie na Twoim urządzeniu."
                },
                disclaimer: {
                    title: "Oświadczenie",
                    content: "Pips Game to niezależny projekt i NIE jest powiązany z The New York Times Company. Wszelkie podobieństwa do innych gier są przypadkowe."
                }
            }
          }
        };

        const BLOG_POSTS = [
            { title: "After Wordle, This Domino Logic Puzzle Takes the Baton!", link: "blog-post-1.html" },
            { title: "Replicating NYT Games’ Brain Pleasure: Pips Game Takes Over Your Daily Thinking", link: "blog-post-2.html" },
            { title: "From NYT to Pips Game: A White-Collar Worker's Ultimate Decompression Tool", link: "blog-post-3.html" },
            { title: "From Connections to Pips Game: A Math Student's Logic Puzzle Addiction", link: "blog-post-4.html" },
            { title: "More Than Just a Game: How Pips Game Became a Teacher’s Secret Weapon", link: "blog-post-5.html" },
            { title: "Focus and Fun: A Freelancer's Guide to Pips Game", link: "blog-post-6.html" },
            { title: "From NYT Mini to Pips Game: A Student-Worker's Ultimate Brain Break", link: "blog-post-7.html" }
        ];

        // --- 工具函数 ---
        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
        const isPrime = (num) => [2, 3, 5].includes(num);

        // --- 约束类型生成器 ---
        const CONSTRAINT_TYPES = ['SUM', 'EQUAL', 'NOT_EQUAL', 'LESS', 'GREATER', 'EVEN', 'ODD', 'NO_6', 'PRODUCT', 'PRIME'];

        const generateConstraintForRegion = (cells) => {
          const values = cells.map(c => c.value);
          const sum = values.reduce((a, b) => a + b, 0);
          const uniqueValues = new Set(values);
          const product = values.reduce((a, b) => a * b, 1);
          const allPrime = values.every(v => isPrime(v));
          
          const possible = [];
          possible.push({ type: 'SUM', value: sum, label: `${sum}` });
          if (uniqueValues.size === 1) possible.push({ type: 'EQUAL', label: '=' });
          if (uniqueValues.size === values.length && values.length > 1) possible.push({ type: 'NOT_EQUAL', label: '≠' });
          if (sum < 15) possible.push({ type: 'LESS', value: sum + getRandomInt(1, 3), label: `<${sum + getRandomInt(1, 3)}` });
          if (sum > 5) possible.push({ type: 'GREATER', value: sum - getRandomInt(1, 3), label: `>${sum - getRandomInt(1, 3)}` });
          if (sum % 2 === 0) possible.push({ type: 'EVEN', label: 'E' });
          if (sum % 2 !== 0) possible.push({ type: 'ODD', label: 'OD' });
          if (!values.includes(6)) possible.push({ type: 'NO_6', label: '∅6' });
          if (product < 100 && product > 0) possible.push({ type: 'PRODUCT', value: product, label: `×${product}` });
          if (allPrime) possible.push({ type: 'PRIME', label: 'P' });

          if (Math.random() > 0.5) return possible[0]; 
          return possible[Math.floor(Math.random() * possible.length)];
        };

        const DominoPip = ({ value, size = "w-2 h-2" }) => {
            const positions = {
                0: [],
                1: [4],
                2: [0, 8],
                3: [0, 4, 8],
                4: [0, 2, 6, 8],
                5: [0, 2, 4, 6, 8],
                6: [0, 2, 3, 5, 6, 8]
            };
            const pips = positions[value] || [];
            
            return (
                <div className="grid grid-cols-3 gap-0.5 p-0.5 w-full h-full pointer-events-none">
                    {[...Array(9)].map((_, i) => (
                        <div key={i} className="flex items-center justify-center">
                            {pips.includes(i) && (
                                <div className={`rounded-full bg-current ${size}`} />
                            )}
                        </div>
                    ))}
                </div>
            );
        };

        // --- 主组件 ---
        function PipsGame() {
          const [lang, setLang] = useState('en');
          const [theme, setTheme] = useState('classic');
          const [board, setBoard] = useState([]);
          const [regions, setRegions] = useState([]);
          const [inventory, setInventory] = useState([]);
          const [placedDominoes, setPlacedDominoes] = useState([]);
          const [dragging, setDragging] = useState(null);
          const [selectedDomino, setSelectedDomino] = useState(null); // Mobile selection state
          const [gameWon, setGameWon] = useState(false);
          const [showRules, setShowRules] = useState(false);
          const [showSettings, setShowSettings] = useState(false);
          const [stats, setStats] = useState({ played: 0 });
          const [gameMode, setGameMode] = useState('classic'); 
          const [streak, setStreak] = useState(0);
          const [nextLevelTimer, setNextLevelTimer] = useState(null);
          
          // 新增弹窗状态
          const [activeModal, setActiveModal] = useState(null); 

          const t = TRANSLATIONS[lang] || TRANSLATIONS['en'];
          const currentYear = new Date().getFullYear();

          // Script Injection
          useEffect(() => {
            const scriptSrc = '/scripts/related.js';
            if (!document.querySelector(`script[src="${scriptSrc}"]`)) {
                const script = document.createElement('script');
                script.src = scriptSrc;
                script.async = true;
                document.body.appendChild(script);
            }
          }, []);

          // URL 参数处理
          useEffect(() => {
            try {
                const params = new URLSearchParams(window.location.search);
                const urlLang = params.get('lang');
                if (urlLang && TRANSLATIONS[urlLang]) {
                  setLang(urlLang);
                }
            } catch (e) {
                console.warn("Could not read URL parameters", e);
            }
          }, []);

          const changeLanguage = (newLang) => {
            setLang(newLang);
            try {
                const url = new URL(window.location);
                url.searchParams.set('lang', newLang);
                window.history.pushState({}, '', url);
            } catch (e) {
                console.warn("URL update blocked by environment:", e);
            }
          };

          const generateGame = (keepStreak = false) => {
            setGameWon(false);
            setPlacedDominoes([]);
            setNextLevelTimer(null);
            setSelectedDomino(null);
            if (!keepStreak) setStreak(0);
            
            const ROWS = 6;
            const COLS = 6;
            let tempBoard = [];
            for(let r=0; r<ROWS; r++) {
                for(let c=0; c<COLS; c++) {
                    tempBoard.push({ id: r*COLS+c, r, c, value: null, regionId: null });
                }
            }

            let availableCells = [...tempBoard.map(c => c.id)];
            let tempDominoes = [];
            let domIdCounter = 0;

            while(availableCells.length >= 2) {
                const cellIdx = Math.floor(Math.random() * availableCells.length);
                const cellId = availableCells[cellIdx];
                const cell = tempBoard.find(c => c.id === cellId);
                
                const neighbors = [
                    {r: cell.r+1, c: cell.c}, {r: cell.r, c: cell.c+1},
                    {r: cell.r-1, c: cell.c}, {r: cell.r, c: cell.c-1}
                ].filter(n => n.r>=0 && n.r<ROWS && n.c>=0 && n.c<COLS);
                
                const validNeighbor = neighbors.find(n => availableCells.includes(n.r*COLS + n.c));
                
                if(validNeighbor) {
                    const neighborId = validNeighbor.r*COLS + validNeighbor.c;
                    const v1 = getRandomInt(0, 6);
                    const v2 = getRandomInt(0, 6);
                    
                    tempBoard[cellId].value = v1;
                    tempBoard[neighborId].value = v2;

                    tempDominoes.push({
                        id: `dom-${domIdCounter++}`,
                        v1, v2,
                        rotated: false,
                        placed: false
                    });

                    availableCells = availableCells.filter(id => id !== cellId && id !== neighborId);
                } else {
                    availableCells = availableCells.filter(id => id !== cellId);
                }
            }

            let seeds = [];
            const numRegions = 8;
            for(let i=0; i<numRegions; i++) {
                seeds.push({ 
                    center: Math.floor(Math.random() * (ROWS*COLS)),
                    colorIdx: i 
                });
            }
            
            tempBoard.forEach(cell => {
                let minKey = -1;
                let minDist = 999;
                seeds.forEach((seed, idx) => {
                    const seedR = Math.floor(seed.center / COLS);
                    const seedC = seed.center % COLS;
                    const dist = Math.abs(cell.r - seedR) + Math.abs(cell.c - seedC);
                    if(dist < minDist) {
                        minDist = dist;
                        minKey = idx;
                    }
                });
                cell.regionId = minKey;
            });

            const newRegions = [];
            for(let i=0; i<numRegions; i++) {
                const regionCells = tempBoard.filter(c => c.regionId === i);
                if(regionCells.length === 0) continue;
                regionCells.forEach(c => { if(c.value === null) c.value = 0; });

                const constraint = generateConstraintForRegion(regionCells);
                newRegions.push({
                    id: i,
                    cells: regionCells.map(c => c.id),
                    constraint: constraint,
                    colorIndex: i 
                });
            }

            tempBoard.forEach(c => c.value = null);
            
            setBoard(tempBoard);
            setRegions(newRegions);
            setInventory(tempDominoes);
          };

          useEffect(() => {
            generateGame();
          }, []);

          const rotateDomino = (domId) => {
            setInventory(prev => prev.map(d => {
              if (d.id === domId) return { ...d, v1: d.v2, v2: d.v1, rotated: !d.rotated };
              return d;
            }));
          };

          const handleDragStart = (e, domino) => {
            setDragging(domino);
            setSelectedDomino(domino); // Also select on drag for hybrid feel
            e.dataTransfer.setData('text/plain', domino.id);
            e.dataTransfer.effectAllowed = "move";
          };

          const handleInventoryClick = (domino) => {
              if (selectedDomino && selectedDomino.id === domino.id) {
                  rotateDomino(domino.id);
              } else {
                  setSelectedDomino(domino);
              }
          };

          const handleDrop = (e, cellId) => {
            e.preventDefault();
            if (dragging) {
                attemptPlacement(dragging, cellId);
                setDragging(null);
            }
          };

          const handleCellClick = (cellId) => {
              if (selectedDomino) {
                  attemptPlacement(selectedDomino, cellId);
              }
          };

          const attemptPlacement = (domino, cellId) => {
            const targetCell = board.find(c => c.id === cellId);
            if (!targetCell) return;

            const ROWS = 6; const COLS = 6;
            const r = targetCell.r;
            const c = targetCell.c;

            let secondCellId = null;
            let orientation = 'h';
            
            if (c + 1 < COLS) {
                secondCellId = r * COLS + (c + 1);
            } else if (r + 1 < ROWS) {
                secondCellId = (r + 1) * COLS + c;
                orientation = 'v';
            }

            const occupied = placedDominoes.some(pd => pd.cell1 === cellId || pd.cell2 === cellId || pd.cell1 === secondCellId || pd.cell2 === secondCellId);
            
            if (secondCellId !== null && !occupied) {
                placeDomino(domino, cellId, secondCellId, orientation);
                setSelectedDomino(null);
            }
          };

          const placeDomino = (domino, c1, c2, orientation) => {
            const newPlaced = {
                id: Date.now(),
                domId: domino.id,
                cell1: c1,
                cell2: c2,
                v1: domino.v1,
                v2: domino.v2,
                orientation
            };
            
            setPlacedDominoes([...placedDominoes, newPlaced]);
            setInventory(inventory.filter(d => d.id !== domino.id));
          };

          const removeDomino = (placedId) => {
            const placed = placedDominoes.find(p => p.id === placedId);
            if (!placed) return;
            setInventory([...inventory, { id: placed.domId, v1: placed.v1, v2: placed.v2, rotated: false }]);
            setPlacedDominoes(placedDominoes.filter(p => p.id !== placedId));
          };

          const validationState = useMemo(() => {
            const result = {}; 
            regions.forEach(region => {
                const cellValues = [];
                let isFull = true;
                region.cells.forEach(cellId => {
                    const placement = placedDominoes.find(p => p.cell1 === cellId || p.cell2 === cellId);
                    if (placement) {
                        if (placement.cell1 === cellId) cellValues.push(placement.v1);
                        else cellValues.push(placement.v2);
                    } else {
                        isFull = false;
                    }
                });

                if (!isFull) {
                    result[region.id] = null;
                    return;
                }

                const vals = cellValues;
                const sum = vals.reduce((a, b) => a + b, 0);
                const prod = vals.reduce((a, b) => a * b, 1);
                const type = region.constraint.type;
                const target = region.constraint.value;
                
                let valid = false;
                switch(type) {
                    case 'SUM': valid = sum === target; break;
                    case 'EQUAL': valid = new Set(vals).size === 1; break;
                    case 'NOT_EQUAL': valid = new Set(vals).size === vals.length; break;
                    case 'LESS': valid = sum < target; break;
                    case 'GREATER': valid = sum > target; break;
                    case 'EVEN': valid = sum % 2 === 0; break;
                    case 'ODD': valid = sum % 2 !== 0; break;
                    case 'NO_6': valid = !vals.includes(6); break;
                    case 'PRODUCT': valid = prod === target; break;
                    case 'PRIME': valid = vals.every(v => isPrime(v)); break;
                    default: valid = true;
                }
                result[region.id] = valid;
            });
            return result;
          }, [placedDominoes, regions]);

          useEffect(() => {
            if (regions.length > 0 && placedDominoes.length > 0 && inventory.length === 0) {
                const allValid = Object.values(validationState).every(v => v === true);
                if (allValid && !gameWon) {
                    setGameWon(true);
                    setStats(s => ({ played: s.played + 1 }));
                    
                    if (gameMode === 'unlimited') {
                        setStreak(s => s + 1);
                        let count = 3;
                        setNextLevelTimer(count);
                        const timer = setInterval(() => {
                            count--;
                            if (count <= 0) {
                                clearInterval(timer);
                                generateGame(true);
                            } else {
                                setNextLevelTimer(count);
                            }
                        }, 1000);
                        return () => clearInterval(timer);
                    }
                }
            } else if (gameWon && inventory.length > 0) {
                setGameWon(false);
            }
          }, [validationState, inventory.length, regions.length, gameMode]);


          const themes = {
            classic: "bg-stone-50 text-stone-900",
            dark: "bg-slate-900 text-slate-100",
            ocean: "bg-cyan-50 text-cyan-900",
            forest: "bg-emerald-50 text-emerald-900",
            sunset: "bg-orange-50 text-orange-900"
          };
          
          const boardColors = {
              classic: ["#e7e5e4", "#d6d3d1", "#a8a29e", "#f5f5f4", "#e5e7eb", "#d1d5db", "#9ca3af", "#f3f4f6"],
              dark: ["#1e293b", "#334155", "#475569", "#0f172a", "#1e1b4b", "#312e81", "#4338ca", "#3730a3"],
              ocean: ["#ecfeff", "#cffafe", "#a5f3fc", "#67e8f9", "#22d3ee", "#06b6d4", "#0891b2", "#0e7490"], 
              forest: ["#ecfdf5", "#d1fae5", "#a7f3d0", "#6ee7b7", "#34d399", "#10b981", "#059669", "#047857"],
              sunset: ["#fff7ed", "#ffedd5", "#fed7aa", "#fdba74", "#fb923c", "#f97316", "#ea580c", "#c2410c"]
          };
          
          const getRegionColor = (idx) => {
              const pal = boardColors[theme] || boardColors.classic;
              return pal[idx % pal.length];
          };

          // Modal Rendering Helper
          const renderModalContent = () => {
            if (!activeModal || !t.modals) return null;
            const modalData = t.modals[activeModal];
            if (!modalData) return null;

            let Icon = Info;
            if (activeModal === 'sitemap') Icon = MapIcon;
            else if (activeModal === 'terms') Icon = ScrollText;
            else if (activeModal === 'privacy') Icon = Lock;
            else if (activeModal === 'disclaimer') Icon = AlertTriangle;

            return (
                <div className="space-y-4">
                    <div className="flex items-center gap-3 text-indigo-500 mb-2">
                        <Icon size={32} />
                        <h3 className="text-xl font-bold">{modalData.title}</h3>
                    </div>
                    <div className="prose prose-sm max-w-none opacity-90 leading-relaxed">
                        <p>{modalData.content}</p>
                        {activeModal === 'sitemap' && modalData.links && (
                             <ul className="grid grid-cols-1 sm:grid-cols-2 gap-2 mt-4">
                                {modalData.links.map((link, i) => (
                                    <li key={i} className="flex items-center gap-2 p-2 bg-black/5 rounded">
                                        <span className="w-1.5 h-1.5 rounded-full bg-indigo-500"></span>
                                        {link}
                                    </li>
                                ))}
                            </ul>
                        )}
                    </div>
                </div>
            );
          };

          return (
            <div className={`min-h-screen flex flex-col font-sans transition-colors duration-300 ${themes[theme]}`}>
              
              {/* Header */}
              <header className={`p-4 flex justify-between items-center sticky top-0 z-20 backdrop-blur-md bg-opacity-80 border-b border-black/5 ${theme === 'dark' ? 'bg-slate-900/80' : 'bg-white/80'}`}>
                <div className="flex items-center gap-3">
                    <div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-indigo-500/30">P</div>
                    <div>
                        <h1 className="font-bold text-xl leading-none flex items-center gap-2 tracking-tight">
                            {t.title}
                            {gameMode === 'unlimited' && <Zap size={18} className="text-yellow-500 fill-current animate-pulse" />}
                        </h1>
                        <p className="text-xs opacity-60 font-mono mt-0.5">#{currentYear-2000}{new Date().getMonth()+1}{new Date().getDate()}</p>
                    </div>
                </div>
                
                <div className="flex gap-2">
                    <button onClick={() => setShowRules(true)} className="p-2.5 rounded-full hover:bg-black/5 transition-colors" title={t.howToPlay}>
                        <HelpCircle size={22} />
                    </button>
                    <button onClick={() => setShowSettings(true)} className="p-2.5 rounded-full hover:bg-black/5 transition-colors" title={t.settings}>
                        <Settings size={22} />
                    </button>
                    <button className="p-2.5 rounded-full hover:bg-black/5 transition-colors" title={t.share}>
                        <Share2 size={22} />
                    </button>
                </div>
              </header>

              {/* Main Game Area */}
              <main className="flex-grow flex flex-col items-center p-4 max-w-3xl mx-auto w-full z-10">
                
                {/* Status Bar */}
                <div className="w-full flex justify-between items-center mb-6 px-2">
                    <div className="flex items-center gap-4 text-sm font-semibold opacity-80 bg-black/5 px-4 py-2 rounded-full">
                        <span>{t.played}: {stats.played}</span>
                        {gameMode === 'unlimited' && (
                            <span className="flex items-center gap-1.5 text-orange-500 font-bold border-l border-black/10 pl-4">
                                <Flame size={16} className="fill-current" /> {t.streak}: {streak}
                            </span>
                        )}
                    </div>
                    <button onClick={() => generateGame(false)} className="flex items-center gap-2 px-4 py-2 rounded-full bg-indigo-100 text-indigo-700 hover:bg-indigo-200 transition-colors font-medium text-sm">
                        <RefreshCw size={16} /> {t.newGame}
                    </button>
                </div>

                {/* Game Board */}
                <div className="relative w-full max-w-[420px] mx-auto mb-8">
                    <div 
                        className={`grid grid-cols-6 gap-0 border-[3px] rounded-xl overflow-hidden shadow-2xl select-none aspect-square
                            ${theme === 'dark' ? 'border-slate-700 bg-slate-800' : 'border-stone-300 bg-stone-200'}
                            ${selectedDomino ? 'ring-4 ring-indigo-400/50 cursor-pointer' : ''}
                        `}
                    >
                        {board.map((cell) => {
                            const region = regions.find(r => r.id === cell.regionId);
                            const status = validationState[region?.id];
                            const isRegionValid = status === true;
                            const isRegionError = status === false;
                            const placed = placedDominoes.find(p => p.cell1 === cell.id || p.cell2 === cell.id);
                            let value = null;
                            if (placed) {
                                value = placed.cell1 === cell.id ? placed.v1 : placed.v2;
                            }
                            const borderClass = `border-r border-b ${theme === 'dark' ? 'border-slate-700/50' : 'border-stone-400/30'}`;

                            return (
                                <div 
                                    key={cell.id}
                                    onDragOver={(e) => e.preventDefault()}
                                    onDrop={(e) => handleDrop(e, cell.id)}
                                    onClick={() => handleCellClick(cell.id)}
                                    className={`relative flex items-center justify-center aspect-square ${borderClass} transition-colors duration-150
                                        ${selectedDomino && !placed ? 'hover:bg-indigo-500/20 active:bg-indigo-500/30' : ''}
                                    `}
                                    style={{ backgroundColor: !selectedDomino || placed ? getRegionColor(cell.regionId) : undefined }}
                                >
                                    {region && region.cells[region.cells.length - 1] === cell.id && (
                                        <div className={`absolute bottom-[2px] right-[2px] text-[9px] sm:text-[10px] font-bold px-1.5 py-0.5 rounded-md z-0 shadow-sm backdrop-blur-sm
                                            ${isRegionValid ? 'bg-emerald-500/90 text-white' : isRegionError ? 'bg-rose-500/90 text-white' : 'bg-black/10 text-black/60'}
                                        `}>
                                            {region.constraint.label}
                                        </div>
                                    )}
                                    {placed && (
                                        <div 
                                            onClick={(e) => { e.stopPropagation(); removeDomino(placed.id); }}
                                            className={`w-full h-full p-[3px] cursor-pointer transform hover:scale-[0.98] transition-all duration-200 z-10 animate-in fade-in zoom-in duration-300`}
                                        >
                                            <div className={`w-full h-full rounded-md shadow-sm border flex items-center justify-center
                                                ${theme === 'dark' ? 'bg-slate-200 text-slate-900 border-slate-400' : 'bg-white text-stone-900 border-stone-200'}
                                            `}>
                                                <DominoPip value={value} size="w-1.5 h-1.5 sm:w-2 sm:h-2" />
                                            </div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>

                    {/* Win Modal */}
                    {gameWon && (
                        <div className="absolute inset-0 flex items-center justify-center z-20 pointer-events-none">
                            <div className="bg-white/95 backdrop-blur-md text-stone-900 px-8 py-6 rounded-2xl shadow-2xl flex flex-col items-center animate-bounce border border-white/50 pointer-events-auto">
                                <Trophy size={48} className="mb-3 text-yellow-500 fill-yellow-500" />
                                <h2 className="text-2xl font-bold mb-1">{t.congrats}</h2>
                                {gameMode === 'unlimited' ? (
                                    <p className="mt-2 font-medium text-stone-500">{t.nextPuzzle} <span className="text-indigo-600 font-bold text-lg">{nextLevelTimer}s</span></p>
                                ) : (
                                    <button onClick={() => generateGame(false)} className="mt-4 px-6 py-2.5 bg-indigo-600 text-white rounded-xl shadow-lg hover:bg-indigo-700 transition-transform active:scale-95 font-bold">
                                        {t.newGame}
                                    </button>
                                )}
                            </div>
                        </div>
                    )}
                </div>

                {/* Inventory */}
                <div className="w-full max-w-[420px] mb-12">
                    <div className={`p-4 rounded-xl min-h-[120px] transition-all duration-300 ${theme === 'dark' ? 'bg-black/20' : 'bg-white/50 shadow-inner'}`}>
                        <div className="flex flex-wrap justify-center gap-3">
                            {inventory.map(domino => {
                                const isSelected = selectedDomino?.id === domino.id;
                                return (
                                    <div
                                        key={domino.id}
                                        draggable
                                        onDragStart={(e) => handleDragStart(e, domino)}
                                        onClick={() => handleInventoryClick(domino)}
                                        className={`
                                            w-[68px] h-[34px] rounded-lg border shadow-sm cursor-pointer select-none
                                            flex items-center transition-all transform duration-200
                                            ${isSelected 
                                                ? 'ring-4 ring-indigo-400 border-indigo-500 scale-110 -translate-y-2 z-10' 
                                                : 'hover:border-indigo-400 hover:-translate-y-0.5'
                                            }
                                            ${theme === 'dark' ? 'bg-slate-200 border-slate-400 text-slate-900' : 'bg-white border-stone-300 text-stone-900'}
                                        `}
                                    >
                                        <div className="w-1/2 h-full border-r border-black/10 flex items-center justify-center">
                                             <DominoPip value={domino.v1} size="w-1.5 h-1.5" />
                                        </div>
                                        <div className="w-1/2 h-full flex items-center justify-center">
                                            <DominoPip value={domino.v2} size="w-1.5 h-1.5" />
                                        </div>
                                    </div>
                                );
                            })}
                            {inventory.length === 0 && !gameWon && (
                                <div className="text-center text-sm opacity-40 w-full py-4 flex flex-col items-center">
                                    <Check size={24} className="mb-1" />
                                    <span>Inventory empty</span>
                                </div>
                            )}
                        </div>
                        <div className="text-center mt-2 text-xs opacity-40">
                            {selectedDomino ? "Tap board to place • Tap again to rotate" : "Drag or Tap to select"}
                        </div>
                    </div>
                </div>

                {/* Info Sections */}
                <div className={`w-full max-w-2xl mt-8 rounded-2xl overflow-hidden shadow-sm border ${theme === 'dark' ? 'bg-slate-800/50 border-slate-700' : 'bg-white border-stone-200'}`}>
                    {/* About Section */}
                    <div className="p-8 border-b border-black/5">
                        <div className="flex items-center gap-3 mb-4 text-indigo-500">
                            <Info size={24} />
                            <h3 className="text-xl font-bold">{t.sections.aboutTitle}</h3>
                        </div>
                        <p className="leading-relaxed opacity-80">{t.sections.aboutDesc}</p>
                    </div>

                    {/* NYT Games Section */}
                    <div className="p-8 border-b border-black/5 bg-indigo-50/30 dark:bg-indigo-900/10">
                        <div className="flex items-center gap-3 mb-4 text-indigo-500">
                            <FileText size={24} />
                            <h3 className="text-xl font-bold">{t.sections.nytTitle}</h3>
                        </div>
                        <p className="leading-relaxed opacity-80">{t.sections.nytDesc}</p>
                    </div>

                    {/* Features Section */}
                    <div className="p-8 border-b border-black/5 bg-black/[0.02]">
                        <div className="flex items-center gap-3 mb-6 text-indigo-500">
                            <Star size={24} />
                            <h3 className="text-xl font-bold">{t.sections.featuresTitle}</h3>
                        </div>
                        <div className="grid md:grid-cols-3 gap-6">
                            {t.sections.features.map((f, i) => (
                                <div key={i} className="space-y-2">
                                    <h4 className="font-bold">{f.t}</h4>
                                    <p className="text-sm opacity-70 leading-relaxed">{f.d}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* FAQ Section */}
                    <div className="p-8 border-b border-black/5">
                        <div className="flex items-center gap-3 mb-6 text-indigo-500">
                            <HelpCircle size={24} />
                            <h3 className="text-xl font-bold">{t.sections.faqTitle}</h3>
                        </div>
                        <div className="space-y-6">
                            {t.sections.faq.map((item, i) => (
                                <div key={i} className="space-y-2">
                                    <h4 className="font-semibold flex items-start gap-2">
                                        <span className="bg-indigo-100 text-indigo-700 text-xs px-2 py-0.5 rounded mt-0.5">Q</span> 
                                        {item.q}
                                    </h4>
                                    <p className="text-sm opacity-70 pl-8">{item.a}</p>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Blog Section (Added as requested) */}
                    <div className={`p-8 ${theme === 'dark' ? 'bg-slate-800/50' : 'bg-stone-50/50'}`}>
                        <div className="flex items-center gap-3 mb-6 text-indigo-500">
                            <BookOpen size={24} />
                            <h3 className="text-xl font-bold">{t.sections.blogTitle || "Latest Articles"}</h3>
                        </div>
                        <div className="space-y-3">
                            {BLOG_POSTS.map((post, i) => (
                                <a 
                                    key={i} 
                                    href={post.link} 
                                    className={`block p-3 rounded-lg transition-all hover:scale-[1.01] flex items-center justify-between group
                                        ${theme === 'dark' ? 'bg-slate-700/50 hover:bg-slate-700' : 'bg-white hover:bg-stone-50 border border-stone-100'}
                                    `}
                                >
                                    <span className="font-medium opacity-90 group-hover:text-indigo-500 transition-colors line-clamp-1">{post.title}</span>
                                    <ExternalLink size={14} className="opacity-0 group-hover:opacity-50 transition-opacity" />
                                </a>
                            ))}
                        </div>
                    </div>

                </div>

              </main>

              {/* Footer */}
              <footer className={`p-10 border-t border-black/10 text-sm opacity-80 mt-12 ${theme === 'dark' ? 'bg-black/20' : 'bg-stone-50'}`}>
                <div className="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 text-center md:text-left">
                    
                    {/* Column 1: Links */}
                    <div className="flex flex-col gap-3">
                        <h4 className="font-bold opacity-50 uppercase tracking-wider text-xs mb-1">{t.title}</h4>
                        <button onClick={() => setActiveModal('about')} className="hover:text-indigo-500 transition-colors text-left text-center md:text-left">{t.footer.about}</button>
                        <button onClick={() => setActiveModal('sitemap')} className="hover:text-indigo-500 transition-colors text-left text-center md:text-left">{t.footer.sitemap}</button>
                        <button onClick={() => setActiveModal('terms')} className="hover:text-indigo-500 transition-colors text-left text-center md:text-left">{t.footer.terms}</button>
                        <button onClick={() => setActiveModal('privacy')} className="hover:text-indigo-500 transition-colors text-left text-center md:text-left">{t.footer.privacy}</button>
                        <button onClick={() => setActiveModal('disclaimer')} className="hover:text-indigo-500 transition-colors text-left text-center md:text-left">{t.footer.disclaimer}</button>
                    </div>

                    {/* Column 2: Friendly Links */}
                    <div className="flex flex-col gap-3">
                        <h4 className="font-bold opacity-50 uppercase tracking-wider text-xs mb-1 flex items-center justify-center md:justify-start gap-1">
                            <Users size={12}/> {t.footer.friendlyLinks}
                        </h4>
                        <a href="https://fungames.today/" target="_blank" rel="noopener noreferrer" className="hover:text-indigo-500 transition-colors flex items-center justify-center md:justify-start gap-1">
                            <ExternalLink size={12} /> Fun Games Today
                        </a>
                        <a href="https://toolboxpro.top/" target="_blank" rel="noopener noreferrer" className="hover:text-indigo-500 transition-colors flex items-center justify-center md:justify-start gap-1">
                            <ExternalLink size={12} /> Toolbox Pro
                        </a>
                        <a href="https://dreamwhisperai.com" target="_blank" rel="noopener noreferrer" className="hover:text-indigo-500 transition-colors flex items-center justify-center md:justify-start gap-1">
                            <ExternalLink size={12} /> Dream Whisper AI
                        </a>
                    </div>

                    {/* Column 3: Copyright & Rules */}
                    <div className="flex flex-col gap-3">
                        <h4 className="font-bold opacity-50 uppercase tracking-wider text-xs mb-1">{t.rules.title}</h4>
                         <button onClick={() => setShowRules(true)} className="hover:text-indigo-500 transition-colors text-left md:text-left text-center">
                            {t.rules.title}
                        </button>
                         <button className="hover:text-indigo-500 transition-colors text-left md:text-left text-center">
                            {t.changelog}
                        </button>
                        <div className="mt-4 opacity-50 text-xs">
                            © {currentYear} Pips Game<br/>
                            {t.footerDisclaimer}
                        </div>
                    </div>
                </div>
                
                {/* Related Tools Container */}
                <div id="related-tools-container" className="mt-8"></div>
              </footer>

              {/* Rules Modal */}
              {showRules && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className={`max-w-md w-full p-6 rounded-2xl shadow-2xl max-h-[85vh] overflow-y-auto border ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-white border-white'}`}>
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-2xl font-bold flex items-center gap-2">
                                <Layout size={24} className="text-indigo-500" />
                                {t.rules.title}
                            </h2>
                            <button onClick={() => setShowRules(false)} className="p-2 hover:bg-black/5 rounded-full"><X size={20}/></button>
                        </div>
                        <div className="space-y-4 text-sm leading-relaxed opacity-90">
                            <p>{t.rules.desc1}</p>
                            <p>{t.rules.desc2}</p>
                            <div className="p-5 bg-indigo-50/50 dark:bg-slate-900/50 rounded-xl border border-indigo-100 dark:border-slate-700">
                                <h3 className="font-bold mb-3 text-indigo-600 dark:text-indigo-400 uppercase text-xs tracking-wider">{t.rules.desc3}</h3>
                                <ul className="grid grid-cols-1 gap-2.5">
                                    <li className="flex items-center gap-2"><span className="font-mono font-bold bg-white dark:bg-slate-700 px-1.5 rounded shadow-sm w-8 text-center">2</span> {t.rules.sum}</li>
                                    <li className="flex items-center gap-2"><span className="font-mono font-bold bg-white dark:bg-slate-700 px-1.5 rounded shadow-sm w-8 text-center">=</span> {t.rules.eq}</li>
                                    <li className="flex items-center gap-2"><span className="font-mono font-bold bg-white dark:bg-slate-700 px-1.5 rounded shadow-sm w-8 text-center">≠</span> {t.rules.neq}</li>
                                    <li className="flex items-center gap-2"><span className="font-mono font-bold bg-white dark:bg-slate-700 px-1.5 rounded shadow-sm w-8 text-center">&lt;8</span> {t.rules.lt}</li>
                                    <li className="flex items-center gap-2"><span className="font-mono font-bold bg-white dark:bg-slate-700 px-1.5 rounded shadow-sm w-8 text-center">&gt;2</span> {t.rules.gt}</li>
                                    <li className="flex items-center gap-2"><span className="font-mono font-bold bg-white dark:bg-slate-700 px-1.5 rounded shadow-sm w-8 text-center">E</span> {t.rules.even}</li>
                                    <li className="flex items-center gap-2"><span className="font-mono font-bold bg-white dark:bg-slate-700 px-1.5 rounded shadow-sm w-8 text-center">OD</span> {t.rules.odd}</li>
                                    <li className="flex items-center gap-2"><span className="font-mono font-bold bg-white dark:bg-slate-700 px-1.5 rounded shadow-sm w-8 text-center">∅6</span> {t.rules.no6}</li>
                                    <li className="flex items-center gap-2"><span className="font-mono font-bold bg-white dark:bg-slate-700 px-1.5 rounded shadow-sm w-8 text-center">×12</span> {t.rules.prod}</li>
                                    <li className="flex items-center gap-2"><span className="font-mono font-bold bg-white dark:bg-slate-700 px-1.5 rounded shadow-sm w-8 text-center">P</span> {t.rules.prime}</li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>
              )}

              {/* Settings Modal */}
              {showSettings && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className={`max-w-xs w-full p-6 rounded-2xl shadow-2xl border ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-white border-white'}`}>
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-xl font-bold flex items-center gap-2">
                                <Settings size={20} className="text-indigo-500" />
                                {t.settings}
                            </h2>
                            <button onClick={() => setShowSettings(false)} className="p-2 hover:bg-black/5 rounded-full"><X size={20}/></button>
                        </div>

                        <div className="space-y-6">
                            {/* Game Mode */}
                            <div>
                                <label className="block text-xs font-bold mb-2 flex items-center gap-1.5 uppercase tracking-wider opacity-60">
                                    <Zap size={14} /> {t.mode}
                                </label>
                                <div className="flex bg-black/5 p-1 rounded-xl">
                                    <button 
                                        onClick={() => { setGameMode('classic'); setStreak(0); generateGame(false); }}
                                        className={`flex-1 py-2 text-sm rounded-lg transition-all font-bold ${gameMode === 'classic' ? 'bg-white shadow text-indigo-600' : 'opacity-60 hover:opacity-100'}`}
                                    >
                                        {t.classic}
                                    </button>
                                    <button 
                                        onClick={() => { setGameMode('unlimited'); setStreak(0); generateGame(false); }}
                                        className={`flex-1 py-2 text-sm rounded-lg transition-all font-bold ${gameMode === 'unlimited' ? 'bg-white shadow text-orange-500' : 'opacity-60 hover:opacity-100'}`}
                                    >
                                        {t.unlimited}
                                    </button>
                                </div>
                            </div>

                            {/* Language */}
                            <div>
                                <label className="block text-xs font-bold mb-2 flex items-center gap-1.5 uppercase tracking-wider opacity-60">
                                    <Globe size={14} /> {t.language}
                                </label>
                                <div className="relative">
                                    <select 
                                        value={lang} 
                                        onChange={(e) => changeLanguage(e.target.value)}
                                        className={`w-full p-2.5 rounded-lg border appearance-none font-medium ${theme === 'dark' ? 'bg-slate-700 border-slate-600' : 'bg-stone-50 border-stone-200'}`}
                                    >
                                        <option value="en">English</option>
                                        <option value="zh-TW">繁體中文</option>
                                        <option value="ru">Русский</option>
                                        <option value="es">Español</option>
                                        <option value="hi">हिन्दी</option>
                                        <option value="pl">Polski</option>
                                    </select>
                                    <div className="absolute right-3 top-3 pointer-events-none opacity-50">▼</div>
                                </div>
                            </div>

                            {/* Theme */}
                            <div>
                                <label className="block text-xs font-bold mb-2 flex items-center gap-1.5 uppercase tracking-wider opacity-60">
                                    {theme === 'dark' ? <Moon size={14}/> : <Sun size={14}/>} {t.theme}
                                </label>
                                <div className="grid grid-cols-5 gap-3">
                                    {Object.keys(themes).map(k => (
                                        <button
                                            key={k}
                                            onClick={() => setTheme(k)}
                                            className={`w-9 h-9 rounded-full border-[3px] transition-transform hover:scale-110 ${theme === k ? 'border-indigo-500 scale-110 shadow-md' : 'border-transparent opacity-80'}`}
                                            style={{ background: boardColors[k][4] }}
                                            title={t.colors[k]}
                                        />
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
              )}

              {/* General Modal */}
              {activeModal && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 backdrop-blur-sm animate-in fade-in duration-200">
                    <div className={`max-w-lg w-full p-6 rounded-2xl shadow-2xl max-h-[85vh] overflow-y-auto border ${theme === 'dark' ? 'bg-slate-800 border-slate-700' : 'bg-white border-white'}`}>
                        <div className="flex justify-end mb-2">
                            <button onClick={() => setActiveModal(null)} className="p-2 hover:bg-black/5 rounded-full"><X size={20}/></button>
                        </div>
                        {renderModalContent()}
                    </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<PipsGame />);
    </script>
</body>
</html>
